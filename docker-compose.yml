# Runs the image built by ./build-collattice-image.sh.
# Compose does not know your uid/gid, so export them (or set RUN_AS) for correct
# ownership of ./collattice:  RUN_AS="$(id -u):$(id -g)" docker compose up -d
services:
  collattice:
    image: ${IMAGE_NAME:-collattice:latest}
    container_name: ${CONTAINER_NAME:-collattice}
    restart: ${RESTART_POLICY:-unless-stopped}
    user: ${RUN_AS:-1000:1000}
    ports:
      - "${HOST_PORT:-8080}:${CONTAINER_PORT:-8080}"
    environment:
      HOME: /tmp
      ASPNETCORE_URLS: http://0.0.0.0:${CONTAINER_PORT:-8080}
      ConnectionStrings__Board: Data Source=/data/collattice.db
      Hosting__ServeSpa: "true"
      Hosting__ListenAddress: 0.0.0.0
      Hosting__ListenPort: ${CONTAINER_PORT:-8080}
      # Defaults to the key baked into the image (cocollattice) when ADMIN_KEY is unset.
      Admin__AuthKey: ${ADMIN_KEY:-cocollattice}
    volumes:
      - ${DATA_DIR:-./collattice}:/data
